[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl_server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.136.1",
    "oph_to_urdf",
    "optimal_morphology_rl",
    "optimal_morphology_rl_pipeline",
    "python-multipart>=0.0.28",
    "uvicorn>=0.47.0",
]

[tool.uv.sources]
oph_to_urdf = { workspace = true, editable = true }
optimal_morphology_rl = { workspace = true, editable = true }
optimal_morphology_rl_pipeline = { workspace = true, editable = true }

[tool.hatch.build.targets.wheel]
py-modules = ["rl_server"]
